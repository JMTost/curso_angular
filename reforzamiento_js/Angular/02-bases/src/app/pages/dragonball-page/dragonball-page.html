<h1>DragonBall Page</h1>

<hr>

<section class="row">

  <div class="col-12 col-sm-6">
<!-- - {{power() || ''}} -->
    <h3>Agregar: {{name()}} </h3>
    <!-- <input type="text" class="form-control" placeholder="Nombre" value={{name()}}>
    <input type="number" class="form-control mt-2" placeholder="Poder" value={{power()}}> -->
    <input type="text" class="form-control" placeholder="Nombre" [value]="name()" (change)="name.set(txtName.value)" (input)="name.set(txtName.value)" #txtName>
    <input type="number" class="form-control mt-2" placeholder="Poder" [value]="power()" (change)="power.set(txtPower.valueAsNumber)" (input)="power.set(txtPower.valueAsNumber)" #txtPower>

    <button class="mt-2 btn btn-success" (click)="addCharacter()">
      Agregar
    </button>

  </div>

  <div class="col-12 col-sm-6">
    <h3>Listado</h3>
    <ul>
      @for(character of characters(); track character.id; let ind = $index){
        @if (character.power > 100) {
          <li>
            {{ind + 1}} -
            <span>{{ character.name }}</span> -
            <strong
            [class.text-danger]="character.power > 9000"
              [class.text-primary]="character.power < 9000"
              >({{ character.power }})</strong>

              <!--
            [ngClass]="powerClass()"

              [class.text-danger]="character.power > 9000"
              [class.text-info]="character.power < 9000"
              -->

            <!-- @if (character.power > 9000) {
              <strong class="text-danger">({{ character.power }})</strong>
            } @else {
              <span class="fs-6">({{ character.power }})</span>
            } -->
          </li>
        } @else {
          <li>
            <strong>Aquí no hay nadie</strong>
          </li>
        }
      }
    </ul>

  </div>

</section>
