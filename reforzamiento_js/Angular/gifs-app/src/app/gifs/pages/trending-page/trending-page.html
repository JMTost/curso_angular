                                                          <!-- Evento de posicion del scroll -->
<div class="h-screen [&::-webkit-scrollbar]:hidden overflow-y-scroll grid grid-cols-2 md:grid-cols-4 gap-4 pt-5" (scroll)="onScroll($event)" #groupDiv>
  @for (elemento of this.gifsService.trendingGifGroup(); track $index) {
    <div class="grid gap-4">
    @for (gif of elemento; track gif.id) {
      <div>
          <img class="h-full w-full rounded-lg object-cover" [src]="gif.url" alt="">
      </div>
    }
    </div>
  }
</div>
